name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@bc713e1ab7598be49b79ba5d9f69e7df59590814 # Pico profile support
    with:
      profiles: '["arduino", "idf", "arduino_esp32s3", "idf_esp32s3", "arduino_esp32c3", "idf_esp32c3", "pico_rp2040", "arduino_rp2040", "arduino_rp2040_freertos"]'
      build_targets: '//:all'
      test_targets: '//:all'

  examples:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@bc713e1ab7598be49b79ba5d9f69e7df59590814 # Pico profile support
    with:
      profiles: '["arduino", "idf", "arduino_esp32s3", "idf_esp32s3", "arduino_esp32c3", "idf_esp32c3", "pico_rp2040", "arduino_rp2040", "arduino_rp2040_freertos"]'
      build_targets: '//examples/...'
      test_targets: '//examples/...'
